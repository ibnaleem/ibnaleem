name: Repository Stats

on:
  schedule:
    - cron: '0 0 */1 * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Embed Stats
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          count() { gh api "search/$1?q=$2&per_page=1" -q '.total_count'; }

          USER_JSON=$(gh api "/users/$USERNAME")
          REPOS_JSON=$(gh api "/users/$USERNAME/repos?per_page=100&type=owner" --paginate \
            | jq -sc 'add | map({stargazers_count, forks_count, fork, language})')

          CONTRIBUTIONS=$(gh api graphql -f login="$USERNAME" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection { contributionCalendar { totalContributions } }
              }
            }' -q '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          STATS_JSON=$(jq -n \
            --arg user "$USERNAME" \
            --argjson profile "$USER_JSON" \
            --argjson repos "$REPOS_JSON" \
            --argjson commits "$(count commits "author:$USERNAME")" \
            --argjson contributions "$CONTRIBUTIONS" \
            --argjson prs_received "$(count issues "type:pr+user:$USERNAME")" \
            --argjson prs_closed "$(count issues "type:pr+user:$USERNAME+state:closed")" \
            --argjson prs_merged "$(count issues "type:pr+author:$USERNAME+is:merged")" \
            --argjson issues_received "$(count issues "type:issue+user:$USERNAME")" \
            --argjson issues_closed "$(count issues "type:issue+user:$USERNAME+state:closed")" \
            --arg updated_at "$(date -u +%F)" \
            '{user: $user,
              member_since: ($profile.created_at[0:4] | tonumber),
              repos: $profile.public_repos,
              followers: $profile.followers,
              stars: ([$repos[].stargazers_count] | add // 0),
              forks: ([$repos[].forks_count] | add // 0),
              top_language: ([$repos[] | select(.fork | not) | .language | values]
                | group_by(.) | max_by(length) | .[0] // null),
              commits: $commits,
              contributions_last_year: $contributions,
              pull_requests: {received: $prs_received, closed: $prs_closed, merged: $prs_merged},
              issues: {received: $issues_received, closed: $issues_closed},
              updated_at: $updated_at}')

          {
            echo '<!--STATS_START-->'
            echo '```json'
            echo "/home/$USERNAME \$ stats --json"
            echo "$STATS_JSON"
            echo '```'
            echo '<!--STATS_END-->'
          } > stats.block

          # Swap everything between the markers for stats.block
          awk '
            FNR==NR { block = block $0 "\n"; next }
            /<!--STATS_START-->/ { printf "%s", block; skip=1 }
            /<!--STATS_END-->/ { skip=0; next }
            !skip { print }
          ' stats.block README.md > README.tmp && mv README.tmp README.md
          rm stats.block

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update stats"
          git push